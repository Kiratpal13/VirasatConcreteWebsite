name: Publish Due Blog Posts

on:
  schedule:
    # Check every day; the script uses America/Edmonton to decide what is due.
    - cron: '15 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scheduled-blog-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Publish due articles
        id: publish
        run: python scripts/publish_due_blogs.py

      - name: Commit and push published articles
        if: steps.publish.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog blog-scheduled sitemap.xml
          git commit -m "Publish scheduled blog posts"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        if: steps.publish.outputs.published == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        if: steps.publish.outputs.published == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy published site
        if: steps.publish.outputs.published == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
